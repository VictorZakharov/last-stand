name: PR preview build

# Builds every pull request, forks included, into an artifact that
# pr-preview.yml publishes. This run executes the PR's code, so it gets a
# read-only token and no secrets; everything that writes (gh-pages, Pages,
# the PR comment) happens in pr-preview.yml, which runs trusted code from main.
# Each build is made for a folder of its own, `pr-preview/pr-N/<sha7>/` (#299:
# Pages' CDN held a fixed path's old build for up to 10 minutes), with the
# stable page that goes to it beside it (`.github/preview-index.html`).

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  # (where Pages serves the site: its path is the preview's base)
  pages: read

concurrency:
  group: pr-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PR preview
    env:
      # the PR's own commit, not the merge commit checked out
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event.action != 'closed' || github.event.pull_request.merged != true)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out pull request
        if: github.event.action != 'closed'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      - name: Test the lab's own code
        if: github.event.action != 'closed'
        run: npm run lab:test

      # the path Pages serves the site under, as its settings have it: a project site's `/last-stand`, none on a custom
      # domain (`https://last-stand.cc`; built under `/last-stand/`, a preview there asked for every file at a path
      # that isn't, and stood on its loading screen). The SITE_ORIGIN variable, if set, wins, as in pr-preview.yml.
      - name: Find where Pages serves the site
        if: github.event.action != 'closed'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASKED_ORIGIN: ${{ vars.SITE_ORIGIN }}
          FALLBACK_ORIGIN: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          origin="${ASKED_ORIGIN}"
          if [[ -z "${origin}" ]]; then
            origin="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.html_url' 2>/dev/null || true)"
          fi
          origin="${origin:-${FALLBACK_ORIGIN}}"
          # the path after the host, without its last slash (empty at a domain's root)
          path="$(printf '%s' "${origin%/}" | sed -E 's#^https?://[^/]+##')"
          echo "PREVIEW_ROOT=${path}/pr-preview/pr-${PR_NUMBER}" >> "${GITHUB_ENV}"
          echo "Pages serves the site at ${origin%/}; previews under ${path}/pr-preview/"

      - name: Type-check and build preview
        if: github.event.action != 'closed'
        env:
          # the pause menu's build label
          BUILD_PR: ${{ github.event.pull_request.number }}
        run: |
          npm run typecheck
          BUILD_SHA="${HEAD_SHA}" npx vite build --base="${PREVIEW_ROOT}/${HEAD_SHA:0:7}/"

      - name: Verify preview asset paths
        if: github.event.action != 'closed'
        run: PAGES_BASE="${PREVIEW_ROOT}/${HEAD_SHA:0:7}/" npm run check:pages

      # pr-preview.yml treats this as untrusted input and checks it against the API
      - name: Describe the preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p preview/site
          if [[ "${PR_ACTION}" != "closed" ]]; then
            folder="${HEAD_SHA:0:7}"
            mkdir -p "preview/site/${folder}"
            cp -a dist/. "preview/site/${folder}/"
            # (main's copy of pr-preview.yml puts its own in place; before #299 it copied this one as it is)
            sed -e "s|__REPO__|${REPO}|g" -e "s|__PR__|${PR_NUMBER}|g" -e "s|__FOLDER__|${folder}|g" \
              .github/preview-index.html > preview/site/index.html
          fi
          printf '{"number":%d,"action":"%s"}\n' "${PR_NUMBER}" "${PR_ACTION}" > preview/pr.json

      - name: Upload preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-preview
          path: preview
          include-hidden-files: true
          retention-days: 1
